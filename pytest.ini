# Pytest configuration for StatXI.
#
# Run the whole suite with `make test` (which calls `venv/bin/python -m pytest`
# from the repo root, so `import src.*` resolves without any path juggling).
#
# The suite is deliberately DB-free: every feature function in src/features.py
# is pure (DataFrame in, values out), so tests build tiny synthetic fixtures
# instead of depending on data/statxi.db (which is gitignored / regenerable).
# The one exception is opt-in real-data sanity checks tagged `needs_db`, which
# auto-skip when the database isn't present (see tests/conftest.py).

[pytest]
testpaths = tests
# -ra prints a short summary of skips/xfails at the end so a skipped needs_db
# test is visible, not silently swallowed.
addopts = -ra
markers =
    needs_db: test needs the regenerable data/statxi.db; auto-skipped when it is absent (rebuild via `make migrate`)
